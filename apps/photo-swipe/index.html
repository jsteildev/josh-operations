<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14100c">
  <title>Photo Swipe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Password gate -->
  <div id="gate" class="gate">
    <div class="gate-card">
      <h1>Photo Swipe</h1>
      <p class="gate-sub">A private curation session. Enter the batch password to begin.</p>
      <form id="gate-form" autocomplete="off">
        <label class="visually-hidden" for="gate-input">Password</label>
        <input id="gate-input" type="password" inputmode="text" placeholder="Password" aria-label="Batch password">
        <button type="submit" class="btn btn-primary">Unlock</button>
      </form>
      <p id="gate-error" class="gate-error" role="alert" hidden>Wrong password. Try again.</p>
    </div>
  </div>

  <!-- Main app -->
  <div id="app" class="app" hidden>
    <header class="topbar">
      <div class="progress-meta">
        <span id="counter" class="counter">0 / 0</span>
        <span id="batch-label" class="batch-label"></span>
      </div>
      <div class="progress-track" aria-hidden="true">
        <div id="progress-fill" class="progress-fill"></div>
      </div>
    </header>

    <main id="stage" class="stage" aria-label="Photo card stack">
      <!-- cards are rendered here by app.js -->
    </main>

    <footer class="controls">
      <button id="btn-archive" class="btn btn-archive" type="button">Archive</button>
      <button id="btn-undo" class="btn btn-ghost" type="button" disabled>Undo</button>
      <button id="btn-igpick" class="btn btn-igpick" type="button">IG Pick</button>
      <button id="btn-keep" class="btn btn-keep" type="button">Keep</button>
    </footer>
    <p class="hint">Drag left to archive, right to keep, up for IG pick. Arrow keys work too.</p>
  </div>

  <!-- End screen -->
  <div id="end" class="end" hidden>
    <div class="end-card">
      <h1>Batch complete</h1>
      <p id="summary" class="summary"></p>
      <ul class="tally">
        <li><span class="dot dot-keep"></span>Kept <strong id="count-keep">0</strong></li>
        <li><span class="dot dot-archive"></span>Archived <strong id="count-archive">0</strong></li>
        <li><span class="dot dot-igpick"></span>IG picks <strong id="count-igpick">0</strong></li>
      </ul>
      <p class="code-label">Results code. Send this back to apply the decisions.</p>
      <div class="code-box">
        <code id="results-code"></code>
      </div>
      <div class="end-actions">
        <button id="btn-copy" class="btn btn-primary" type="button">Copy code</button>
      </div>
      <p id="copy-status" class="copy-status" role="status" aria-live="polite"></p>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
